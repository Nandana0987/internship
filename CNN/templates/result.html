<!DOCTYPE html>
<html>
<head>

<title>Prediction Result</title>

<style>

body{
font-family:Arial;
text-align:center;
background:#f2f2f2;
padding-top:40px;
}

.card{
background:white;
width:500px;
margin:auto;
padding:20px;
border-radius:10px;
box-shadow:0px 0px 10px gray;
}

img{
width:300px;
height:300px;
object-fit:cover;
}

</style>

</head>

<body>

<div class="card">

<h2>Prediction Result</h2>

<img src="/{{image_path}}">

<h3>Animal: {{animal}}</h3>

<h3>Confidence: {{confidence}}%</h3>

<a href="/">Try Another Image</a>

</div>

</body>
</html>

<!DOCTYPE html>
<html>
<head>

<title>Prediction Result</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

height:100vh;

display:flex;
justify-content:center;
align-items:center;

background:linear-gradient(
135deg,
#667eea,
#764ba2
);

}

.card{

background:white;

padding:40px;

border-radius:20px;

width:550px;

text-align:center;

box-shadow:0px 10px 30px rgba(0,0,0,0.2);

}

img{

width:250px;
height:250px;

object-fit:contain;

margin:20px 0;

border:2px solid #ddd;

padding:10px;

border-radius:10px;

}

h1{

margin-bottom:20px;

color:#333;

}

.result{

font-size:28px;

font-weight:bold;

color:#667eea;

margin-top:15px;

}

.confidence{

font-size:22px;

margin-top:10px;

color:#444;

}

.btn{

display:inline-block;

margin-top:25px;

padding:12px 25px;

background:#667eea;

color:white;

text-decoration:none;

border-radius:10px;

}

.btn:hover{

background:#5a67d8;

}

.error{

color:red;

font-size:22px;

}

</style>

</head>

<body>

<div class="card">

{% if error %}

<p class="error">

{{ error }}

</p>

<a href="/" class="btn">

Go Back

</a>

{% else %}

<h1>Prediction Result</h1>

<img src="/{{image_path}}">

<div class="result">

Predicted Digit: {{ digit }}

</div>

<div class="confidence">

Confidence: {{ confidence }}%

</div>

<a href="/" class="btn">

Predict Another Digit

</a>

{% endif %}

</div>

</body>
</html>

<!DOCTYPE html>
<html>
<head>

<title>Attendance Records</title>

<style>

body{
    font-family:Arial;
    background:#f4f6f9;
}

.container{
    width:95%;
    margin:auto;
    margin-top:30px;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
}

th{
    background:#2c3e50;
    color:white;
    padding:12px;
}

td{
    padding:10px;
    text-align:center;
    border:1px solid #ddd;
}

tr:nth-child(even){
    background:#f2f2f2;
}

a{
    display:inline-block;
    margin-top:20px;
    padding:10px 15px;
    background:#3498db;
    color:white;
    text-decoration:none;
    border-radius:5px;
}

</style>

</head>

<body>

<div class="container">

<h2>Attendance Records</h2>

<table>

<tr>
    <th>ID</th>
    <th>Employee ID</th>
    <th>Name</th>
    <th>Date</th>
    <th>Time</th>
    <th>Confidence</th>
</tr>

{% for row in records %}

<tr>

    <td>{{ row['id'] }}</td>

    <td>{{ row['employee_id'] }}</td>

    <td>{{ row['employee_name'] }}</td>

    <td>{{ row['date'] }}</td>

    <td>{{ row['time'] }}</td>

    <td>{{ row['confidence'] }}%</td>

</tr>

{% endfor %}

</table>

<a href="/">
Dashboard
</a>

</div>

</body>
</html>

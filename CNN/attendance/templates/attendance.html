<!DOCTYPE html>
<html>
<head>
    <title>Mark Attendance</title>

    <style>

        body{
            font-family:Arial;
            background:#f4f6f9;
        }

        .container{
            width:500px;
            margin:80px auto;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0px 2px 10px rgba(0,0,0,0.2);
        }

        h2{
            text-align:center;
        }

        input[type=file]{
            width:100%;
            margin-top:20px;
        }

        button{
            width:100%;
            margin-top:20px;
            padding:12px;
            border:none;
            background:#27ae60;
            color:white;
            font-size:16px;
            border-radius:5px;
            cursor:pointer;
        }

        button:hover{
            background:#219150;
        }

    </style>

</head>

<body>

<div class="container">

    <h2>Upload Employee Face</h2>

    <form
        action="/mark_attendance"
        method="POST"
        enctype="multipart/form-data"
    >

        <input
            type="file"
            name="image"
            accept="image/*"
            required
        >

        <button type="submit">
            Mark Attendance
        </button>

    </form>

</div>

</body>
</html>

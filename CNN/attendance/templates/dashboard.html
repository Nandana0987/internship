<!DOCTYPE html>
<html>
<head>
    <title>Employee Attendance Dashboard</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background:#f4f6f9;
            margin:0;
        }

        .navbar{
            background:#2c3e50;
            color:white;
            padding:15px;
            font-size:24px;
            text-align:center;
        }

        .container{
            width:90%;
            margin:auto;
            margin-top:30px;
        }

        .cards{
            display:flex;
            gap:20px;
            flex-wrap:wrap;
        }

        .card{
            flex:1;
            min-width:200px;
            background:white;
            padding:20px;
            border-radius:10px;
            box-shadow:0px 2px 10px rgba(0,0,0,0.1);
            text-align:center;
        }

        .card h2{
            margin:0;
            color:#3498db;
        }

        .card p{
            font-size:25px;
            font-weight:bold;
        }

        .btn{
            display:inline-block;
            margin-top:30px;
            padding:12px 20px;
            background:#3498db;
            color:white;
            text-decoration:none;
            border-radius:5px;
        }

        .btn:hover{
            background:#2980b9;
        }
    </style>

</head>

<body>

<div class="navbar">
    Employee Attendance Dashboard
</div>

<div class="container">

    <div class="cards">

        <div class="card">
            <h2>Total Employees</h2>
            <p>{{ total_employees }}</p>
        </div>

        <div class="card">
            <h2>Present Today</h2>
            <p>{{ present_today }}</p>
        </div>

        <div class="card">
            <h2>Absent Today</h2>
            <p>{{ absent_today }}</p>
        </div>

        <div class="card">
            <h2>Total Records</h2>
            <p>{{ total_records }}</p>
        </div>

    </div>

    <a href="/attendance" class="btn">
        Mark Attendance
    </a>

    <a href="/records" class="btn">
        View Records
    </a>

</div>

</body>
</html>


<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Center</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:"Segoe UI",sans-serif;
    min-height:100vh;
    background:linear-gradient(-45deg,#020617,#0f172a,#1e293b,#111827);
    background-size:400% 400%;
    animation:bgMove 15s ease infinite;
    color:white;
}

@keyframes bgMove{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

.navbar{
    background:rgba(255,255,255,.05);
    backdrop-filter:blur(15px);
    border-bottom:1px solid rgba(255,255,255,.1);
}

.glass{
    background:rgba(255,255,255,.05);
    border-radius:20px;
    backdrop-filter:blur(15px);
    border:1px solid rgba(255,255,255,.1);
    padding:25px;
}

.progress{
    height:12px;
    border-radius:20px;
    background:#1f2937;
}

.option{
    background:#111827;
    padding:15px;
    border-radius:15px;
    margin-bottom:15px;
    cursor:pointer;
    transition:.3s;
    border:1px solid #1f2937;
}

.option:hover{
    border-color:#3b82f6;
    transform:translateX(5px);
}

.timer{
    font-size:20px;
    color:#facc15;
    font-weight:bold;
}

.stat-card{
    background:rgba(255,255,255,.05);
    border-radius:20px;
    padding:20px;
    text-align:center;
}

.stat-card i{
    font-size:35px;
    color:#60a5fa;
}

.btn{
    border-radius:15px;
}

</style>

</head>
<body>

<nav class="navbar navbar-dark px-4">

    <a href="/dashboard" class="btn btn-outline-light">
        <i class="bi bi-arrow-left"></i>
        Dashboard
    </a>

    <h3>📝 Quiz Center</h3>

    <div class="timer">
        ⏱ <span id="time">10:00</span>
    </div>

    <div>
        <a href="/dashboard" class="btn btn-outline-light btn-sm">
            Dashboard
        </a>

        <a href="/logout" class="btn btn-outline-danger btn-sm">
            Logout
        </a>
    </div>

</nav>


<div class="container mt-5">

<div class="row mb-4">

<div class="col-md-4">
<div class="stat-card">
<i class="bi bi-book"></i>
<h5 class="mt-3">{{ course }}</h5>
<small>Selected Course</small>
</div>
</div>

<div class="col-md-4">
<div class="stat-card">
<i class="bi bi-question-circle"></i>
<h5 class="mt-3" id="totalQuestions">Loading...</h5>
<small>Total Questions</small>
</div>
</div>

<div class="col-md-4">
<div class="stat-card">
<i class="bi bi-bar-chart"></i>
<h5 class="mt-3">Intermediate</h5>
<small>Difficulty</small>
</div>
</div>

</div>


<div class="glass mb-4">

<h6 id="questionCount">
Loading Question...
</h6>

<div class="progress mt-3">

<div class="progress-bar bg-success"
id="progressBar"
style="width:0%">
</div>

</div>

</div>


<div class="glass">

<h3 class="mb-4" id="question"></h3>

<div id="options"></div>

<hr>

<div class="d-flex justify-content-between">

<button class="btn btn-secondary"
onclick="prevQuestion()">
Previous
</button>

<button class="btn btn-primary"
onclick="nextQuestion()">
Next
</button>

</div>

<button class="btn btn-success w-100 mt-4"
onclick="submitQuiz()">
Submit Quiz
</button>

</div>

</div>



<script>

let quizData = [];
let currentQuestion = 0;
let answers = [];


fetch("/generate-quiz")
.then(response => response.json())
.then(data => {

    quizData = data.questions;

    document.getElementById("totalQuestions").innerHTML =
        quizData.length + " Questions";

    loadQuestion();

})
.catch(error => {

    alert("Unable to load quiz.");

});


function loadQuestion(){

    document.getElementById("questionCount").innerHTML =
    "Question " + (currentQuestion+1)
    + " of "
    + quizData.length;

    document.getElementById("progressBar").style.width =
    ((currentQuestion+1)/quizData.length)*100 + "%";


    document.getElementById("question").innerHTML =
    quizData[currentQuestion].question;


    let html = "";

    quizData[currentQuestion].options.forEach(option=>{

        html += `
        <div class="option">

            <label>

            <input type="radio"
            name="answer"
            value="${option}"
            ${answers[currentQuestion]===option?"checked":""}>

            ${option}

            </label>

        </div>
        `;

    });

    document.getElementById("options").innerHTML = html;

}



function nextQuestion(){

    let selected =
    document.querySelector('input[name="answer"]:checked');

    if(selected){

        answers[currentQuestion] = selected.value;

    }

    if(currentQuestion < quizData.length-1){

        currentQuestion++;

        loadQuestion();

    }

}



function prevQuestion(){

    let selected =
    document.querySelector('input[name="answer"]:checked');

    if(selected){

        answers[currentQuestion] = selected.value;

    }

    if(currentQuestion > 0){

        currentQuestion--;

        loadQuestion();

    }

}



function submitQuiz() {

    let selected = document.querySelector(
        'input[name="answer"]:checked'
    );

    // Save last answer if selected
    if (selected) {
        answers[currentQuestion] = selected.value;
    }

    // Calculate score
    let score = 0;

    for (let i = 0; i < quizData.length; i++) {
        if (answers[i] === quizData[i].answer) {
            score++;
        }
    }

    // Message logic
    let message = "";
    let color = "";

    if (score <= 3) {
        message = "📚 Need to Improve. Keep practicing and revise the concepts.";
        color = "#ef4444";
    }
    else if (score <= 6) {
        message = "👍 Good! Keep Learning and you'll improve further.";
        color = "#f59e0b";
    }
    else if (score <= 8) {
        message = "🌟 Excellent! You have understood the concepts well.";
        color = "#22c55e";
    }
    else {
        message = "🏆 Outstanding Performance!";
        color = "#3b82f6";
    }

    // Show result screen (FIXED UI)
    document.querySelector(".glass").innerHTML = `
        <div class="text-center p-4">
            <h2 class="mb-3">Quiz Completed</h2>

            <h1 style="font-size: 3rem; color: ${color};">
                ${score} / ${quizData.length}
            </h1>

            <p class="mt-3" style="font-size: 1.2rem;">
                ${message}
            </p>

            <button onclick="location.reload()" 
                class="btn btn-primary mt-4">
                Try Again
            </button>
        </div>
    `;
}
// TIMER

let totalSeconds = 600;

function updateTimer(){

    let minutes = Math.floor(totalSeconds/60);
    let seconds = totalSeconds%60;

    document.getElementById("time").innerHTML =
    String(minutes).padStart(2,'0')
    + ":"
    + String(seconds).padStart(2,'0');

    totalSeconds--;

    if(totalSeconds < 0){

        submitQuiz();

    }

}

setInterval(updateTimer,1000);

</script>

</body>
</html>

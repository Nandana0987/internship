<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Tutor</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body {
    margin: 0;
    font-family: Arial;
    background: #0b1220;
    color: white;
}

/* TOP BAR */
.topbar {
    background: #111827;
    padding: 15px;
    text-align: center;
    font-weight: bold;
    font-size: 20px;
    border-bottom: 1px solid #1f2937;
}

/* CHAT AREA */
.chat-container {
    height: calc(100vh - 200px);
    overflow-y: auto;
    padding: 20px;
}

/* MESSAGE STYLE */
.msg {
    padding: 12px 15px;
    margin: 10px 0;
    border-radius: 12px;
    max-width: 50%;
    line-height: 1.4;
}

/* USER */
.user {
    background: #2563eb;
    margin-left: auto;
    text-align: right;
}

/* BOT */
.bot {
    background: #1f2937;
}

/* INPUT BOX */
.input-area {
    display: flex;
    padding: 15px;
    border-top: 1px solid #1f2937;
    background: #111827;
}

.input-area input {
    flex: 1;
    padding: 12px;
    border-radius: 8px;
    border: none;
    outline: none;
}

.input-area button {
    margin-left: 10px;
    padding: 12px 20px;
    border: none;
    border-radius: 8px;
    background: #2563eb;
    color: white;
}

.input-area button:hover {
    background: #1d4ed8;
}

.typing {
    font-style: italic;
    color: #9ca3af;
}

</style>
</head>

<body>
<nav class="navbar navbar-dark bg-dark px-3">
    <a class="navbar-brand" href="/dashboard">🎓 LMS Portal</a>

    <div>
        <a href="/dashboard" class="btn btn-outline-light btn-sm">Dashboard</a>
        <a href="/logout" class="btn btn-outline-danger btn-sm">Logout</a>
    </div>
</nav>
<div class="topbar">
🤖 AI Tutor (Smart Learning Assistant)
</div>

<div id="chat" class="chat-container">

    <div class="msg bot">
        👋 Hello! I am your AI Tutor. Ask me anything.
    </div>

</div>

<div class="input-area">

    <input type="text" id="question" placeholder="Ask your question...">

    <button onclick="send()">Send</button>

</div>

<script>

function addMessage(text, type) {

    let div = document.createElement("div");
    div.className = "msg " + type;
    div.innerText = text;

    document.getElementById("chat").appendChild(div);

    document.getElementById("chat").scrollTop =
        document.getElementById("chat").scrollHeight;
}

function send() {

    let input = document.getElementById("question");
    let text = input.value.trim();

    if (!text) return;

    // show user message
    addMessage(text, "user");

    input.value = "";

    // typing indicator
    let typing = document.createElement("div");
    typing.className = "msg bot typing";
    typing.innerText = "AI is thinking...";
    typing.id = "typing";
    document.getElementById("chat").appendChild(typing);

    fetch("/ask-ai", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ question: text })
    })
    .then(res => res.json())
    .then(data => {

        // remove typing
        document.getElementById("typing").remove();

        addMessage(data.answer, "bot");

    })
    .catch(err => {

        document.getElementById("typing").remove();

        addMessage("❌ Error connecting to AI server", "bot");

    });

}

</script>

</body>
</html>

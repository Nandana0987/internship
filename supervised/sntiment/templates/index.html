<!DOCTYPE html>
<html>

<head>

<title>Sentiment Analysis Dashboard</title>

<style>

body{

margin:0;
padding:0;

background:url('/static/bg.jpg');

background-size:cover;
background-position:center;

font-family:Arial;

height:100vh;

display:flex;
justify-content:center;
align-items:center;
}

.container{

width:600px;

background:rgba(255,255,255,0.90);

padding:40px;

border-radius:20px;

text-align:center;

box-shadow:0px 0px 25px black;
}

h1{

color:#333;
}

textarea{

width:100%;
height:120px;

padding:10px;

font-size:18px;

border-radius:10px;
}

button{

padding:12px 30px;

margin-top:20px;

font-size:18px;

background:#007BFF;

color:white;

border:none;

border-radius:10px;

cursor:pointer;
}

button:hover{

background:#0056b3;
}

.result{

margin-top:25px;
}

.emoji{

font-size:100px;
}

</style>

</head>

<body>

<div class="container">

<h1>😊 Sentiment Analysis Dashboard</h1>

<form action="/predict" method="POST">

<textarea
name="comment"
placeholder="Enter your comment here..."
required></textarea>

<br>

<button type="submit">
Analyze Sentiment
</button>

</form>

{% if result %}

<div class="result">

<h2>{{ result }}</h2>

<div class="emoji">
{{ emoji }}
</div>

<p><b>Comment:</b> {{ text }}</p>

</div>

{% endif %}

</div>

</body>

</html>

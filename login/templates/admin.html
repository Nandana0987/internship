<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f6f9;
        }

        .card-box {
            border-radius: 15px;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.1);
        }

        .navbar {
            box-shadow: 0px 2px 10px rgba(0,0,0,0.1);
        }
    </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-dark bg-dark px-4">
    <span class="navbar-brand">Face Recognition Admin Panel</span>
    <a href="/logout" class="btn btn-danger" style="float:right;">
    Logout
</a>
</nav>

<!-- DASHBOARD -->
<div class="container mt-5">

    <div class="row">

        <div class="col-md-4">
            <div class="card card-box p-3 text-center">
                <h5>Welcome</h5>
                <h3 class="text-primary">{{ user }}</h3>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card card-box p-3 text-center">
                <h5>Login Status</h5>
                <h4 class="text-success">Active</h4>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card card-box p-3 text-center">
                <h5>System</h5>
                <h4 class="text-warning">Face Verified</h4>
            </div>
        </div>

    </div>

    <!-- EXTRA SECTION -->
    <div class="card card-box mt-4 p-4">
        <h4>Admin Actions</h4>
        <hr>

        <button class="btn btn-primary">View Reports</button>
        <button class="btn btn-success">Check Attendance</button>
        <button class="btn btn-warning">System Logs</button>
    </div>

</div>

</body>
</html>
